apiVersion: v1
kind: Service
metadata:
  name: {{ include "radosgw-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radosgw-exporter.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http-metrics
      protocol: TCP
      name: http-metrics
  selector:
    {{- include "radosgw-exporter.selectorLabels" . | nindent 4 }}