{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "radosgw-exporter.fullname" . }}
  namespace: {{ .Values.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    {{- include "radosgw-exporter.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobLabel: {{ include "radosgw-exporter.fullname" . }}
  selector:
    matchLabels:
      {{- include "radosgw-exporter.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http-metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      scheme: {{ .Values.serviceMonitor.scheme }}
      {{- if .Values.serviceMonitor.tlsConfig }}
      tlsConfig:
        {{- toYaml .Values.serviceMonitor.tlsConfig | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceMonitor.basicAuth.enabled }}
      basicAuth:
        {{- if .Values.serviceMonitor.basicAuth.existingSecret }}
        username:
          name: {{ .Values.serviceMonitor.basicAuth.existingSecret }}
          key: {{ .Values.serviceMonitor.basicAuth.usernameKey }}
        password:
          name: {{ .Values.serviceMonitor.basicAuth.existingSecret }}
          key: {{ .Values.serviceMonitor.basicAuth.passwordKey }}
        {{- else }}
        username:
          name: {{ include "radosgw-exporter.fullname" . }}-basic-auth
          key: username
        password:
          name: {{ include "radosgw-exporter.fullname" . }}-basic-auth
          key: password
        {{- end }}
      {{- end }}
      {{- with .Values.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}